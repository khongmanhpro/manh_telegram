services:
  bot:
    build: .
    container_name: telegram-shop-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      # Dùng cho admin web/webhook; nên đặt sau reverse proxy HTTPS trên VPS.
      - "127.0.0.1:${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${WEBHOOK_PORT:-3000}/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
